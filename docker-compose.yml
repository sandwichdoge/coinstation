# CoinStation — backend (FastAPI) + frontend (nginx-served React).
#   docker compose up --build
#   frontend  -> http://localhost:8080
#   backend   -> http://localhost:8000/api/health
#
# Analysis is rule-based (technical indicators only); no API keys required.

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/coinstation.db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./data:/app/data        # persists the SQLite news archive
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
